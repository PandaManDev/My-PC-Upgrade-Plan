<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pandas Chat Inbox</title><style>
:root{color-scheme:dark;--bg:#0b0713;--panel:#171022;--line:#3b2450;--purple:#c084fc;--text:#fbf7ff;--muted:#b9a8cb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#4c1d6d 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:16px;margin-top:20px}.panel{background:#151020dd;border:1px solid var(--line);border-radius:16px;overflow:hidden}.pad{padding:16px}.field,button{font:inherit}.field{width:100%;padding:12px;border-radius:10px;background:#0b0713;border:1px solid var(--line);color:white;margin:6px 0 12px}.btn{border:0;border-radius:10px;padding:10px 14px;background:linear-gradient(135deg,#7c3aed,#c026d3);color:white;font-weight:800;cursor:pointer}.list{max-height:65vh;overflow:auto}.conv{display:block;width:100%;text-align:left;padding:13px;border:0;border-bottom:1px solid #ffffff12;background:transparent;color:white;cursor:pointer}.conv.active,.conv:hover{background:#9333ea24}.conv strong,.conv small{display:block}.conv small{color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.thread{height:54vh;min-height:300px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.msg{max-width:85%;align-self:flex-start;padding:10px 12px;border-radius:13px;background:#261936;white-space:pre-wrap;overflow-wrap:anywhere}.msg.owner{align-self:flex-end;background:#6d28d9}.msg small{display:block;font-size:10px;opacity:.7;margin-top:4px}.reply{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff12}.reply .field{margin:0;min-width:0}.status{min-height:22px;color:#e9d5ff;font-size:13px}.hidden{display:none!important}@media(max-width:720px){.wrap{padding:14px}.layout{grid-template-columns:1fr}.list{max-height:250px}.thread{height:42vh;min-height:240px}}
</style></head><body><main class="wrap"><div class="head"><div><h1 style="margin:0">🐼 Pandas Chat Inbox</h1><div class="muted">Private owner dashboard for your website messages</div></div><button id="logout" class="btn hidden">Lock inbox</button></div>
<section id="login" class="panel pad" style="max-width:460px;margin:28px auto"><h2>Owner sign in</h2><p class="muted">Enter the admin secret configured on your chat backend. It is kept only in this browser tab.</p><form id="loginForm"><input id="secret" class="field" type="password" autocomplete="current-password" placeholder="Admin secret" required><button class="btn">Unlock inbox</button></form><p id="loginStatus" class="status"></p></section>
<section id="inbox" class="layout hidden"><div class="panel"><div class="pad"><strong>Conversations</strong><button id="notifyEnable" class="btn" style="float:right;padding:5px 9px;margin-left:6px">Enable notifications</button><button id="refresh" class="btn" style="float:right;padding:5px 9px">Refresh</button><p class="muted">Select a visitor to read and reply.</p></div><div id="conversations" class="list"></div></div><div class="panel"><div class="pad"><strong id="threadTitle">Choose a conversation</strong><p id="threadMeta" class="muted"></p></div><div id="thread" class="thread"></div><form id="replyForm" class="reply"><input id="replyText" class="field" maxlength="1500" placeholder="Write a reply…" required disabled><button id="send" class="btn" disabled>Send</button></form></div></section><p id="status" class="status"></p></main>
<script>
const API='/api/admin';let secret='',activeId='',threadInitialized=false,pollTimer=null;const $=id=>document.getElementById(id);const seenMessages=new Set();function ding(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(660,c.currentTime+.16);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.13,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.24);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25);o.onended=()=>c.close()}catch(e){}}function notifyAdmin(m){if('Notification'in window&&Notification.permission==='granted'){const n=new Notification('New website chat message',{body:(m.senderName||'Visitor')+': '+m.text,tag:'pup-chat-'+m.conversationId});n.onclick=()=>{window.focus();openConversation(m.conversationId,m.senderName||'Visitor');n.close()}}}$('notifyEnable').addEventListener('click',async()=>{if(!('Notification'in window)){$('status').textContent='Browser notifications are not supported by this browser';return}const p=await Notification.requestPermission();$('status').textContent=p==='granted'?'Browser notifications enabled':'Notifications were not enabled'});
async function call(url,options={}){const res=await fetch(url,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+secret,...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Request failed');return data}
function showInbox(){ $('login').classList.add('hidden');$('inbox').classList.remove('hidden');$('logout').classList.remove('hidden');loadConversations();if(!pollTimer)pollTimer=setInterval(()=>{loadConversations();if(activeId)loadThread()},5000) }
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();secret=$('secret').value;try{await call(API);showInbox();$('loginStatus').textContent=''}catch(err){$('loginStatus').textContent=err.message;secret=''}});
$('logout').addEventListener('click',()=>{if(pollTimer){clearInterval(pollTimer);pollTimer=null}threadInitialized=false;seenMessages.clear();secret='';activeId='';$('secret').value='';$('inbox').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');$('thread').replaceChildren()});
$('refresh').addEventListener('click',loadConversations);
async function loadConversations(){try{const data=await call(API);const list=$('conversations');list.replaceChildren();data.conversations.forEach(c=>{const b=document.createElement('button');b.className='conv'+(c.conversationId===activeId?' active':'');const title=document.createElement('strong');title.textContent=c.visitorName||'Visitor';const preview=document.createElement('small');preview.textContent=(c.lastMessage||'No messages')+' · '+(c.lastAt?new Date(c.lastAt).toLocaleString():'');b.append(title,preview);b.addEventListener('click',()=>openConversation(c.conversationId,c.visitorName));list.append(b)});if(!data.conversations.length)list.textContent='No messages yet.';if(activeId)await loadThread()}catch(err){$('status').textContent=err.message}}
async function openConversation(id,name){activeId=id;$('threadTitle').textContent=name||'Visitor';$('threadMeta').textContent='Conversation ID: '+id;$('replyText').disabled=false;$('send').disabled=false;await loadConversations();await loadThread()}
async function loadThread(){if(!activeId)return;try{const data=await call(API+'?action=messages&conversationId='+encodeURIComponent(activeId));data.messages.forEach(m=>{if(!seenMessages.has(m.id)){if(threadInitialized&&m.sender==='visitor'){ding();notifyAdmin(m)}seenMessages.add(m.id)}});threadInitialized=true;const thread=$('thread');thread.replaceChildren();data.messages.forEach(m=>{const el=document.createElement('div');el.className='msg'+(m.sender==='owner'?' owner':'');const body=document.createElement('span');body.textContent=m.text;const meta=document.createElement('small');meta.textContent=(m.sender==='owner'?'You':m.senderName||'Visitor')+' · '+new Date(m.createdAt).toLocaleString();el.append(body,meta);thread.append(el)});thread.scrollTop=thread.scrollHeight}catch(err){$('status').textContent=err.message}}
$('replyForm').addEventListener('submit',async e=>{e.preventDefault();const text=$('replyText').value.trim();if(!text||!activeId)return;$('send').disabled=true;try{await call(API,{method:'POST',body:JSON.stringify({action:'reply',conversationId:activeId,text})});$('replyText').value='';await loadThread();await loadConversations();$('status').textContent='Reply sent'}catch(err){$('status').textContent=err.message}finally{$('send').disabled=false}});
</script></body></html>
